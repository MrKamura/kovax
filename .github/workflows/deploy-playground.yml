# Builds the playground SPA + Storybook and publishes both to GitHub Pages.
# Enable Pages in the repo: Settings → Pages → Source: GitHub Actions.
#
# Playground: https://<owner>.github.io/<repository>/
# Storybook:  https://<owner>.github.io/<repository>/storybook/

name: Deploy site

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Install Yarn (Storybook workspace)
        run: npm install -g yarn@1.22.22

      - name: Cache Storybook node_modules
        uses: actions/cache@v4
        with:
          path: apps/storybook/node_modules
          key: storybook-${{ runner.os }}-${{ hashFiles('apps/storybook/yarn.lock') }}
          restore-keys: storybook-${{ runner.os }}-

      - name: Install Storybook deps (yarn)
        run: yarn --cwd apps/storybook install --frozen-lockfile --ignore-scripts --network-timeout 600000

      - name: Build playground
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: npm run build:playground

      - name: Build Storybook
        env:
          STORYBOOK_BASE_PATH: /${{ github.event.repository.name }}/storybook/
        run: yarn --cwd apps/storybook build

      - name: Merge Storybook into Pages artifact
        run: |
          mkdir -p apps/playground/dist/storybook
          cp -r apps/storybook/storybook-static/. apps/playground/dist/storybook/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/playground/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
