# Builds the playground SPA and publishes it to GitHub Pages.
# Enable Pages in the repo: Settings → Pages → Source: GitHub Actions.
#
# Site URL: https://<owner>.github.io/<repository>/
# The workflow sets VITE_BASE_PATH to /<repository>/ so asset URLs resolve correctly.

name: Deploy playground

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build playground
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: npm run build:playground

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/playground/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
